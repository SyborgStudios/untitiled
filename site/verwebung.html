Kreideliste", "detail": "AUSSEN. DESTILLERIE, MAUER — TAG", "titelEn": "The Chalk List", "seqTitleEn": "The Child of the Lie"}, {"id": "G79", "strang": "G", "seq": "Seq 7", "seqTitle": "Das Kind der Lüge", "titel": "Die Bitte", "detail": "AUSSEN. VOR DER WERKSTATT — TAG", "titelEn": "The Plea", "seqTitleEn": "The Child of the Lie"}, {"id": "G80", "strang": "G", "seq": "Seq 7", "seqTitle": "Das Kind der Lüge", "titel": "Das Fernglas vor der Tür", "detail": "AUSSEN. VOR DER WERKSTATT — NACHT", "titelEn": "The Binoculars at the Door", "seqTitleEn": "The Child of the Lie"}, {"id": "G81", "strang": "G", "seq": "Seq 8", "seqTitle": "Der Lauf", "titel": "Die Waschung", "detail": "AUSSEN. INNENHOF DER DESTILLERIE — MORGEN  ·  „Die Waschung\" · „Die Schrift auf den Armen\" · „Das Vielleicht\" · „Das Pferdchen auf dem Tisch\"", "titelEn": "The Washing", "seqTitleEn": "The Run"}, {"id": "G82", "strang": "G", "seq": "Seq 8", "seqTitle": "Der Lauf", "titel": "Der Zug", "detail": "AUSSEN. HAUPTSTRASSE — TAG", "titelEn": "The Procession", "seqTitleEn": "The Run"}, {"id": "G83", "strang": "G", "seq": "Seq 8", "seqTitle": "Der Lauf", "titel": "Die Supernova", "detail": "AUSSEN. DIE FELDER — TAG", "titelEn": "The Supernova", "seqTitleEn": "The Run"}, {"id": "G84", "strang": "G", "seq": "Seq 8", "seqTitle": "Der Lauf", "titel": "Die Stille danach", "detail": "AUSSEN. STADT / WEG ZUM HÜGEL — TAG", "titelEn": "The Stillness After", "seqTitleEn": "The Run"}, {"id": "G85", "strang": "G", "seq": "Seq 8", "seqTitle": "Der Lauf", "titel": "Die Geschichte, laut", "detail": "AUSSEN. AUSSICHTSORT — MORGENGRAUEN", "titelEn": "The Story, Out Loud", "seqTitleEn": "The Run"}, {"id": "G86", "strang": "G", "seq": "Seq 8", "seqTitle": "Der Lauf", "titel": "Das Schild", "detail": "AUSSEN. WEG ZUR ABSPERRUNG — TAG", "titelEn": "The Sign", "seqTitleEn": "The Run"}, {"id": "G87", "strang": "G", "seq": "Seq 8", "seqTitle": "Der Lauf", "titel": "Der Hund", "detail": "AUSSEN. MAUER DER GANG — TAG", "titelEn": "The Dog", "seqTitleEn": "The Run"}], "felder": [{"id": "F1", "strang": "F", "seq": "Seq I", "seqTitle": "Die Felder", "titel": "Farbe", "detail": "Die Felder in Blüte, die Ernte in Reihen, das τ-Plakat am Feldweg; Fuhre um Fuhre rollt hinter die Hofmauer der Destillerie — und im Schaufenster der Stadt der winzige Flakon hinter Glas.", "last": "Die Welt vor dem Grau. Die Ökonomie als Bild (viel Pflanze, kleine Flasche — Setup für 9); Tau/τ etabliert.", "titelEn": "Colour", "seqTitleEn": "The Fields"}, {"id": "F2", "strang": "F", "seq": "Seq I", "seqTitle": "Die Felder", "titel": "Drei Stunden", "detail": "Paul Jahn am Feldrand, Stadtschuhe. Man hat ihm Lenz empfohlen — den einen, der die Pflanze mit den Händen kennt; Jahn kennt sie aus Papieren. Seine Fragen sind keine offensichtlichen, sondern detaillierte — und Lenz antwortet drei Stunden lang: die Erntezeitpunkte, die dem normalen Arbeiter egal sind und der Produktion wohl auch. Er zerreibt zwei Blüten verschiedener Ernte in den Handflächen: zwei verschiedene Filme auf der Haut. Jahn erkennt den Unterschied — fein für ihn, krass für Lenz. Zum Abschied gibt Lenz ihm Proben mit, nach Erntezeit getrennt.", "last": "Buch und Hand — Wissen gegen Würde; es fragt ihn zum ersten Mal ein Studierter, statt zu befehlen; der Unterschied, den nur Lenz ernst nimmt, und die Proben (das Setup von 5).", "titelEn": "Three Hours", "seqTitleEn": "The Fields"}, {"id": "F3", "strang": "F", "seq": "Seq I", "seqTitle": "Die Felder", "titel": "Die Nase", "detail": "Destillerie innen: Lenz prüft die Maische — ein Zug durch die Nase, ein Wort, und der Meister korrigiert den Kessel.", "last": "Lenz' Meisterschaft; Setup der gefallenen Fertigkeit (der Fusel, 23) und der Nase.", "titelEn": "The Nose", "seqTitleEn": "The Fields"}, {"id": "F4", "strang": "F", "seq": "Seq I", "seqTitle": "Die Felder", "titel": "Zwischen zwei Schlucken", "detail": "Ruths Küche, zu klein für die Leute darin; das Lachen zwei Häuser weit; Lenz' Nummer. Dann, beiläufig: Eigentlich gehören die Felder denen, die sie kennen. Jahn stellt sein Glas ab.", "last": "Der Satz und sein wahrer Besitzer (der Stachel — Zündstoff für 30–33); Ruth; das gute Leben.", "titelEn": "Between Two Sips", "seqTitleEn": "The Fields"}, {"id": "F5", "strang": "F", "seq": "Seq I", "seqTitle": "Die Felder", "titel": "Der Schlag", "detail": "Jahns Labor, nachts: Er kocht Lenz' Proben, wie man Tau kocht — im luftdicht geschlossenen Gefäß, Routine, so würde er es immer machen. Als er die Stauden herausnimmt, halb abgekühlt, fasst er die von der guten Ernte an — die bei Tau geschnittenen — und bekommt einen elektrischen Schlag. Er erschrickt, probiert wieder, und wieder. „Was zur Hölle.\" Tage später: zwei Drähte an einer Staude, eine Lampe, die flackert — und hält.", "last": "Die Entdeckung als Zufall der Routine, nicht als Suche — und als Payoff von 2: Die Energie steckt genau in dem Unterschied, den nur die Felder kennen; der Satz aus 4 wird Physik. (Stille Pointe: Die gute Ernte ist die Tau-Ernte — im Namen des Luxusguts steckt von Anfang an die Energie.)", "titelEn": "The Shock", "seqTitleEn": "The Fields"}, {"id": "F6", "strang": "F", "seq": "Seq II", "seqTitle": "Zwei Käufer", "titel": "Das Lachen an der falschen Stelle", "detail": "Der halbvolle Saal, die erste Rede — gut und eine Spur zu schön. Mitten hinein lacht eine Frau. Nach der Rede sucht er sie, nicht umgekehrt.", "last": "Beginn der Bewegung; Helene — die Einzige, die über seine Reden lachen darf.", "titelEn": "The Laugh in the Wrong Place", "seqTitleEn": "Two Buyers"}, {"id": "F7", "strang": "F", "seq": "Seq II", "seqTitle": "Zwei Käufer", "titel": "Die Lehrerin", "detail": "Helene vor ihrer Klasse, eine Geschichte, dreißig stille Kinder; Jahn wartet an der Tür und hört zu.", "last": "Die Erzählerin (das spätere Erbe der Muttergeschichte); die Ehe im Werden — er spricht zu tausend, sie zu dreißig, und keiner hält seins für größer.", "titelEn": "The Teacher", "seqTitleEn": "Two Buyers"}, {"id": "F8", "strang": "F", "seq": "Seq II", "seqTitle": "Zwei Käufer", "titel": "Der Souffleur", "detail": "Auftritte: Lenz steht daneben und hält keine Reden — sein Dastehen ist die Rede. Nachts in der Küche liefert er die Pointen; Jahn ruiniert am nächsten Tag jede einzelne; Ruth lacht trotzdem.", "last": "Die Mechanik der Bewegung; der Satz zieht durch die Stadt, und niemand weiß, wessen er ist.", "titelEn": "The Prompter", "seqTitleEn": "Two Buyers"}, {"id": "F9", "strang": "F", "seq": "Seq II", "seqTitle": "Zwei Käufer", "titel": "Zwei Käufer", "detail": "Der Empfang: der Flakon Tau als Gastgeschenk; Verehrung gegen Mehrwert; hundert Kilo für eine Flasche; Mehrwert ist nicht Profit. Beide lassen das Angebot des anderen stehen.", "last": "Der Konflikt als Ökonomie; das einzige ehrliche Gespräch der beiden; im Lächeln die Strategiewahl (Setup 10).", "titelEn": "Two Buyers", "seqTitleEn": "Two Buyers"}, {"id": "F9a", "strang": "F", "seq": "Seq II", "seqTitle": "Zwei Käufer", "titel": "Das Geschenk", "detail": "Tage nach dem Empfang: Bei Helene kommt ein Päckchen an — kein Absender, keine Karte. In Seide: der Flakon, Tau. Sie weiß, von wem es ist. Sie stellt ihn nicht auf, sie wirft ihn nicht weg — sie legt ihn in eine kleine Schachtel.", "last": "Die Verehrung findet den zweiten Weg, ins Haus des Mannes, der sie abgelehnt hat (Setzung 14.08.; die gesichtslose Sendung ist Inszenierungs-Angebot, Alternative persönliche Übergabe → `entwicklung.md`). Helenes Fingerhut Eitelkeit (Dossier); das Objekt der dritten Erbschaft kommt in die Welt.", "titelEn": "The Gift", "seqTitleEn": "Two Buyers"}, {"id": "F10", "strang": "F", "seq": "Seq III", "seqTitle": "Das Werk", "titel": "Termine wie Feiertage", "detail": "Der Magnat finanziert, drängt, lobt in jede Kamera. Schneller, Freunde. Die Zukunft wartet nicht. Wer bremst, ist Feind des Volkes.", "last": "Die Umarmungs-Sabotage; das Werk wird größer und schneller, als Jahn verantworten kann.", "titelEn": "Deadlines Like Holidays", "seqTitleEn": "The Works"}, {"id": "F11", "strang": "F", "seq": "Seq III", "seqTitle": "Das Werk", "titel": "Der Unfall", "detail": "Das Labor: Seit dem Schlag arbeiten sie mit reiner Tau-Ernte. Der Assistent kippt zwischen den Zerstäubern um, mitten im Satz — wie ein ausgeknipstes Licht. Er wacht wieder auf.", "last": "Die reine Tau-Ernte ist weit stärker, als alle Studien sagen — gemessen wurden immer Tagesmischungen (Setzung 14.08.); das Vorzeichen des Großen.", "titelEn": "The Accident", "seqTitleEn": "The Works"}, {"id": "F12", "strang": "F", "seq": "Seq III", "seqTitle": "Das Werk", "titel": "Das Protokoll", "detail": "Jahn und die Sprachregelung: Nach außen existiert der Vorfall nicht, nach innen gilt ein Wortlaut. Der Assistent sagt nichts — er hält nur seither vor den Kesseln den Atem an.", "last": "Die Vertuschung als aktive erste Schuld; das halbe Wissen der Zeugen (Quelle der späteren Kanäle, 14/29).", "titelEn": "The Report", "seqTitleEn": "The Works"}, {"id": "F13", "strang": "F", "seq": "Seq III", "seqTitle": "Das Werk", "titel": "Der Kessel wird halten", "detail": "Nachts über den Papieren: Das zweite Gutachten unterschlägt nichts — es beschreibt die krassere Wirkung der Dämpfe an der Luft und erklärt damit den Unfall; auch die zweite Schlussfolgerung steht darin: Mit den Tau-Ernten steigt der Druck im Kessel weit über das, was die Mischungen je erzeugt haben. Der Kessel ist gesichert — für einen gewissen Überdruck. Aber das Werk ist schon im Bau, es ist zu wenig Zeit, und der Kessel wird das schon halten: So schließt das Papier. Seine Zweifel behält Jahn für sich. Helene liest es nicht.", "last": "Die Beugung, präzisiert (Setzung 14.08.): keine unterschlagenen Fakten — der beruhigende Schluss über den eigenen Warnungen. Exakt das Papier, das die Intrige braucht (29); niemand weiß, was er weiß.", "titelEn": "The Boiler Will Hold", "seqTitleEn": "The Works"}, {"id": "F14", "strang": "F", "seq": "Seq III", "seqTitle": "Das Werk", "titel": "Ein Wort, kein Maß", "detail": "Woanders: Hände, ein makelloser Rücken, eine Meldung. Der Magnat erfährt von einem Zwischenfall im Labor — ein Wort, kein Maß.", "last": "Die Kanäle; seine Rechnung bleibt die Blamage, nicht die Katastrophe.", "titelEn": "A Word, No Measure", "seqTitleEn": "The Works"}, {"id": "F15", "strang": "F", "seq": "Seq III", "seqTitle": "Das Werk", "titel": "Das Richtfest", "detail": "Der Rohbau, drei Meter hohe Buchstaben: JAHN-WERK. Lenz legt die Hand an einen Träger und sagt nichts; Jahn sieht es und fragt nicht. Smalltalk.", "last": "Das versäumte Gespräch — der Stoff der späteren Reue beider Männer.", "titelEn": "The Topping-Out", "seqTitleEn": "The Works"}, {"id": "F15a", "strang": "F", "seq": "Seq III", "seqTitle": "Das Werk", "titel": "Das Foto", "detail": "Beim Richtfest: Ein Fotograf der Bewegung stellt vier Menschen mit Fahnen vor den Rohbau — Jahn, Lenz, Ruth mit Anton auf dem Arm, lachend, und Helene, ein wenig gedreht, eine Hand tief auf dem Kleid. Es dauert einen Atemzug, dann ist es ein Bild.", "last": "Der Ursprung des Klassenraum-Plakats (Fixpunkt 56a „Das vierte Gesicht\"; K2 entschieden 16.08.) — das Bild, aus dem die Stadt später drei Gesichter kratzt und eines nicht.", "titelEn": "The Photo", "seqTitleEn": "The Works"}, {"id": "F16", "strang": "F", "seq": "Seq III", "seqTitle": "Das Werk", "titel": "Der Ort", "detail": "Der Aussichtsort: das Geländer, der weite Blick, das Familienwort ins Ohr. Unten im Panorama das fast vollendete Werk. Sie sagt ihm, dass sie schwanger ist.", "last": "Das Glück mit der Drohung im Bild — nur er kann sie sehen; der Spiegel-Ort der ersten Fassung; die Kohorten-Uhr beginnt.", "titelEn": "The Place", "seqTitleEn": "The Works"}, {"id": "F17", "strang": "F", "seq": "Seq III", "seqTitle": "Das Werk", "titel": "Feldfrauen", "detail": "Ruths Küche, leerer als früher: Ruth tastet Helenes Bauch, macht Feldfrauen-Witze — und ist selbst schwanger. Die Küche plant ein Fest, das nie stattfinden wird.", "last": "Nur Ruth weiß es (Setzung 24.07.); Jakob wird vorbereitet; die Vertrautheit der Frauen (Quelle von Lenz' späterem Wissen um das Kind).", "titelEn": "Field Women", "seqTitleEn": "The Works"}, {"id": "F18", "strang": "F", "seq": "Seq IV", "seqTitle": "Die Nacht des Werks", "titel": "Der Saal", "detail": "Vierhundert Stühle, eine Nacht lang — am Morgen soll die Feier sein. Lenz schleppt Stühle für die Zukunft und flucht liebevoll über den Freund. Zu Hause schläft Anton, zwei Jahre alt, neben der schwangeren Ruth.", "last": "Die private Mathematik wird geladen — bei der Sache statt beim Sohn (Fixpunkt: Lenz' „Stühle\"-Monolog der ersten Fassung).", "titelEn": "The Hall", "seqTitleEn": "The Night of the Works"}, {"id": "F19", "strang": "F", "seq": "Seq IV", "seqTitle": "Die Nacht des Werks", "titel": "Das Licht über dem Fluss", "detail": "Der Nachthimmel verliert die Farbe. Lenz rennt gegen einen Strom aus Menschen — und kommt zu spät. Ruth im Hof, lebend, schreiend; ein Kinderbett, das niemand mehr braucht; der süße, falsche Geruch.", "last": "Die Katastrophe aus Lenz' Nähe; Antons Tod; der Geruch als Vorbote des Sterbens (Echo von 11).", "titelEn": "The Light Over the River", "seqTitleEn": "The Night of the Works"}, {"id": "F20", "strang": "F", "seq": "Seq IV", "seqTitle": "Die Nacht des Werks", "titel": "Das Kommuniqué", "detail": "Noch während es brennt: die Radiostimme — Terroranschlag aus dem Umfeld des Politikers Jahn, er selbst tot. Ein Stempel, Hände, kein Gesicht.", "last": "Die Geburt der Lüge als Verwaltungsakt; sie verbiegt eine Wahrheit (der Name auf dem Werk, der verschwiegene Unfall).", "titelEn": "The Communiqué", "seqTitleEn": "The Night of the Works"}, {"id": "F21", "strang": "F", "seq": "Seq IV", "seqTitle": "Die Nacht des Werks", "titel": "Hinterhöfe", "detail": "Drei Menschen verschwinden in der brennenden Nacht: ein Mann, eine Frau, ein ungeborener dritter.", "last": "Die Flucht; das formale Scharnier — hier wechselt die Erzählung die Seite (S1).", "titelEn": "Backyards", "seqTitleEn": "The Night of the Works"}, {"id": "F22", "strang": "F", "seq": "Seq V", "seqTitle": "Vier Jahre", "titel": "Die Monate", "detail": "Die Stadt stirbt in Monaten: die ersten Male, die Abriegelung. Jakob wird in ein Haus geboren, in dem ein Bett zu viel steht. (Die Drops setzen erst Jahre später ein — Setzung 16.08., K4; wann genau, bleibt diesig, auch Ruth weiß es nicht genau.)", "last": "Der Weltumbau im Raffer; die Kohortenlogik konkret.", "titelEn": "The Months", "seqTitleEn": "Four Years"}, {"id": "F23", "strang": "F", "seq": "Seq V", "seqTitle": "Vier Jahre", "titel": "Der stille Säufer", "detail": "Lenz pflegt Ruth und destilliert Fusel — dieselbe Fertigkeit, gefallen. Er trinkt gegen die Präzision: Nüchtern rechnet die Selbstanklage, und die Nase liest die Male der Frau.", "last": "Ich war bei dir statt bei ihm — die Schuld ist älter als jede Intrige (Fundament der Doppel-Lesbarkeit von 34–36).", "titelEn": "The Quiet Drinker", "seqTitleEn": "Four Years"}, {"id": "F24", "strang": "F", "seq": "Seq V", "seqTitle": "Vier Jahre", "titel": "Drei Zimmer", "detail": "Das Versteck in Ausschnitten: der Redner, der berufsmäßig flüstert; Helene geht hinaus — tauschen, besorgen, horchen — und trägt die Familie.", "last": "Die Enge als Form (S1); die Rollenumkehr; Anna lernt die Welt als Fensterausschnitt.", "titelEn": "Three Rooms", "seqTitleEn": "Four Years"}, {"id": "F25", "strang": "F", "seq": "Seq V", "seqTitle": "Vier Jahre", "titel": "Das Fensterspiel", "detail": "Hinter dem Vorhang: Namen für die Leute unten, Wolken zu Tieren, unterdrücktes Kichern. Auf der Fensterbank das hölzerne Pferdchen.", "last": "Die innige Vater-Beziehung (gesetzt 15.07.); das Verstecken als Spiel — das Setup, das in 34 das Leben rettet; das Pferdchen.", "titelEn": "The Window Game", "seqTitleEn": "Four Years"}, {"id": "F26", "strang": "F", "seq": "Seq V", "seqTitle": "Vier Jahre", "titel": "Das Familienwort", "detail": "An guten Abenden: die Geschichte vom Ort mit dem Licht — man geht den Weg, der sich dreht, und zählt die Schritte —, das Pferdchen in der Kinderhand (Setzung 16.08., K3), das Wort ins Ohr, immer nur ins Ohr. Wenn alles vorbei ist, gehen wir hin.", "last": "Das Erbe der Mutter; das Versprechen, das erst die Kinder der ersten Fassung einlösen.", "titelEn": "The Family Word", "seqTitleEn": "Four Years"}, {"id": "F26a", "strang": "F", "seq": "Seq V", "seqTitle": "Vier Jahre", "titel": "Der Tropfen", "detail": "Beim Kramen, das Kind auf dem Arm, stoßen sie auf die Schachtel. Helene öffnet sie: ein einziger Tropfen auf den Handrücken, die Hand vors Gesicht der Kleinen. Anna riecht. Dann schließt sich die Schachtel wieder.", "last": "Die wärmste Minute des Verstecks — Liebe als Geruch, ohne ein Wort, das man erinnern könnte; der Ursprung der dritten Erbschaft (der Duft-Rest, Dossier). Der Payoff — Anna, Jahre später, im Feld — ist geparkt (`../ideen.md`, Eintrag 2).", "titelEn": "The Drop", "seqTitleEn": "Four Years"}, {"id": "F27", "strang": "F", "seq": "Seq V", "seqTitle": "Vier Jahre", "titel": "Die Zeile", "detail": "Helene bringt eine Nachricht mit: Der älteste Sohn des Freundes ist in der Nacht gestorben. Jahn setzt eine Zeile an — und riskiert sie nicht.", "last": "Die unterlassene Zeile, seine schwerste Schuld; eine Tür, die sich lautlos schließt.", "titelEn": "The Line", "seqTitleEn": "Four Years"}, {"id": "F28", "strang": "F", "seq": "Seq VI", "seqTitle": "Der Umschlag", "titel": "Die Frau, die einkaufen geht", "detail": "Ein Gesicht, das zweimal auffällt; ein Bote, der wartet.", "last": "Die schuldlose Spur — Helene, die vier Jahre alles richtig machte, wird einfach gesehen.", "titelEn": "The Woman Who Goes Shopping", "seqTitleEn": "The Envelope"}, {"id": "F29", "strang": "F", "seq": "Seq VI", "seqTitle": "Der Umschlag", "titel": "Ein Recht darauf", "detail": "Hände halten einen Umschlag: die Nachricht, dass der Mann lebt, und eine Abschrift des Gutachtens — weich genug, um gebaut worden zu sein, deutlich genug, um zu „beweisen\". Die temperierte Stimme: Ich finde, der Mann hat ein Recht darauf, es zu wissen.", "last": "Die reinen Hände; gefälscht wird mit echtem Material; die Herkunft der Abschrift bleibt geahnt (halbes Wissen sucht Kanäle, 12).", "titelEn": "A Right to Know", "seqTitleEn": "The Envelope"}, {"id": "F30", "strang": "F", "seq": "Seq VI", "seqTitle": "Der Umschlag", "titel": "Eigene Findigkeit", "detail": "Der Umschlag erreicht Lenz so, dass er ihn für eigene Findigkeit hält.", "last": "Die unsichtbare Führung; sein Irrtum beginnt als Stolz.", "titelEn": "His Own Resourcefulness", "seqTitleEn": "The Envelope"}, {"id": "F31", "strang": "F", "seq": "Seq VI", "seqTitle": "Der Umschlag", "titel": "Die Probe", "detail": "Er will es nicht glauben. Er säuft sich durch die Nacht. Er steht vor der Ruine und liest den Namen in drei Meter hohen Buchstaben.", "last": "Die Alternativen-Prüfung, erster Teil — der Kohlhaas-Kipp bekommt seine Sorgfalt.", "titelEn": "The Test", "seqTitleEn": "The Envelope"}, {"id": "F32", "strang": "F", "seq": "Seq VI", "seqTitle": "Der Umschlag", "titel": "Am Bett", "detail": "Er kommt zu Ruth und bringt es nicht über die Lippen. Die Trauer kippt in Sinn: Wenn er lebt, hat mein Sohn einen Schuldigen.", "last": "Der Kipp vollzogen — Notwehr der Seele, keine Dummheit.", "titelEn": "At the Bedside", "seqTitleEn": "The Envelope"}, {"id": "F33", "strang": "F", "seq": "Seq VI", "seqTitle": "Der Umschlag", "titel": "Die Waffe", "detail": "Er nimmt sie wie ein Mann, der ein Geständnis erzwingen will und sich selbst nicht mehr traut. Zu Hause schläft ein Dreijähriger. Er tritt in die Nacht — und die Erzählung verliert ihn in den Hinterhöfen.", "last": "Der Aufbruch und die Lücke — hier beginnt die Indizien-Lösung; ein Umkehren bliebe denkbar, wir sehen es nicht.", "titelEn": "The Gun", "seqTitleEn": "The Envelope"}, {"id": "F34", "strang": "F", "seq": "Seq VII", "seqTitle": "Die Tür", "titel": "Das Klopfen", "detail": "Ein Abend wie hundert davor: das Fläschchen im Lampenkreis am Boden (Fixpunkt: Szene 1 der ersten Fassung; das Pferdchen zeigt die Nacht nicht — Setzung 16.08., K3). Dann das Klopfen; ein Blick der Eltern — und das Kind ist unter dem Tisch, bevor jemand ein Wort sagt. Der Vater öffnet: die Stimme zum ersten Mal in vier Jahren laut, ein einziges Wort, beinahe froh — zwei Silben, die das Kind nicht kennt.", "last": "Der Wechsel zum Kind (S1, dritter Schritt); kein Name, kein Gesicht — für niemanden; das Verstecken-Spiel (25) zahlt aus.", "titelEn": "The Knock", "seqTitleEn": "The Door"}, {"id": "F35", "strang": "F", "seq": "Seq VII", "seqTitle": "Die Tür", "titel": "Unter dem Tisch", "detail": "Stimmen, die steigen und brechen; die Wörter kommen nicht bis unter den Tisch. Ein gestreckter Arm im gelben Licht, eine Waffe am Ende; am inneren Unterarm, überscharf, ein Mal. Der erste Schuss. Die Mutter — Füße, Lauf, Mantelstoff — geht dazwischen. Der zweite. Stille. Die Stiefel bleiben zu lange; das Geräusch ist Weinen — wessen, sagt der Strang nicht.", "last": "Die Tat in der Blickgeometrie des Kindes — Motiv, Mal und Weg sprechen, bewiesen ist nichts (Täter-Entscheidung A).", "titelEn": "Under the Table", "seqTitleEn": "The Door"}, {"id": "F36", "strang": "F", "seq": "Seq VII", "seqTitle": "Die Tür", "titel": "Die offene Tür", "detail": "Die Stiefel gehen. Im gelben Lichtkreis: das Kind, das alles gesehen hat. Die Tür steht offen.", "last": "Das Endbild — hier endet der Strang; unter dem Tisch beginnt der andere.", "titelEn": "The Open Door", "seqTitleEn": "The Door"}]};

DATA.gegenwart.concat(DATA.felder).forEach(function (k) { KARTEN[k.id] = k; });

var stand = ladeStand();
function ladeStand() {
  try {
    var s = JSON.parse(localStorage.getItem(KEY) || "null");
    if (s && s.order) { s.deleted = s.deleted || []; s.notes = s.notes || {}; s.custom = s.custom || {}; return s; }
  } catch (e) {}
  /* Erstbesuch: Stand des Autors (18.08.) — so, wie er ihn gelassen hat */
  return { order: AUTOR.order.slice(), deleted: AUTOR.deleted.slice(), notes: {}, custom: {} };
}
function alleIds() { var ids = AUSGANG.slice(); Object.keys(stand.custom).forEach(function (id) { if (ids.indexOf(id) === -1) ids.push(id); }); return ids; }
function normalisiere() {
  var bekannt = function (id) { return KARTEN[id] || stand.custom[id]; };
  stand.order = stand.order.filter(bekannt); stand.deleted = stand.deleted.filter(bekannt);
  alleIds().forEach(function (id) { if (stand.order.indexOf(id) === -1 && stand.deleted.indexOf(id) === -1) stand.order.push(id); });
}
function speichere() { stand.order = [].map.call(liste.children, function (li) { return li.dataset.id; }); localStorage.setItem(KEY, JSON.stringify(stand)); }
function speichereOhneDom() { localStorage.setItem(KEY, JSON.stringify(stand)); }

}

}
function wachse(t) { t.style.height = "auto"; t.style.height = (t.scrollHeight + 2) + "px"; }

function karteEl(id, imKorb) {
  var k = info(id);
  var cls = k.strang === "G" ? "g" : (k.strang === "F" ? "f" : "n");
  var li = document.createElement("li");
  li.className = "card offen " + cls;
  li.dataset.id = id;
  var nr = k.strang === "N" ? id.replace(/^N/, "") : id.replace(/^[GF]/, "");
  var tag = "<b>" + k.strang + "</b> " + nr + " · " + seqVon(k);
  var html = '<div class="kopf"><span class="tag">' + tag + '</span>';
  if (k.strang !== "N") html += '<span class="titel">' + titelVon(k) + "</span>";
  html += "</div>";
  html += '<div class="detail">';
  if (k.strang === "N") {
    html += '<input type="text" class="titelfeld" placeholder="' + T("neuPlatz") + '">';
    html += '<textarea class="textfeld" placeholder="' + T("neuText") + '"></textarea>';
  } else {
    var quelle = k.detail || "";
    if (k.strang === "F" && k.last) quelle += '<div class="last">' + T("last") + k.last + "</div>";
    html += '<div class="quelle">' + quelle + "</div>";
  }
  html += '<label class="notizlabel">' + T("notiz") + '</label>';
  html += '<textarea class="notiz" placeholder="—"></textarea>';
  html += '<div class="aktionen"><button class="btnNotiz">' + T("notizLeer") + '</button> <button class="btnDel">' + (imKorb ? T("restore") : T("del")) + "</button></div>";
  html += "</div>";
  li.innerHTML = html;

  var notiz = li.querySelector(".notiz");
  notiz.value = stand.notes[id] || "";
  notiz.addEventListener("input", function () { stand.notes[id] = notiz.value; if (!notiz.value) delete stand.notes[id]; wachse(notiz); speichereOhneDom(); });
  if (k.strang === "N") {
    var tf = li.querySelector(".titelfeld"), xf = li.querySelector(".textfeld");
    var c = stand.custom[id] || {};
    tf.value = (c.titel && c.titel !== "Neue Szene" && c.titel !== "New scene") ? c.titel : "";
    xf.value = c.text || "";
    tf.addEventListener("input", function () { stand.custom[id].titel = tf.value || T("neuTitel"); speichereOhneDom(); });
    xf.addEventListener("input", function () { stand.custom[id].text = xf.value; wachse(xf); speichereOhneDom(); });
  }
  li.querySelector(".btnNotiz").addEventListener("click", function () { notiz.value = ""; delete stand.notes[id]; wachse(notiz); speichereOhneDom(); });
  li.querySelector(".btnDel").addEventListener("click", function () {
    if (imKorb) { stand.deleted = stand.deleted.filter(function (d) { return d !== id; }); li.remove(); liste.appendChild(karteEl(id, false)); speichere(); }
    else { li.remove(); stand.deleted.push(id); delListe.appendChild(karteEl(id, true)); speichere(); }
    korbAnzeigen(); zaehle(); melde();
  });
  return li;
}

function baue() {
  normalisiere();
  liste.innerHTML = ""; delListe.innerHTML = "";
  stand.order.forEach(function (id) { liste.appendChild(karteEl(id, false)); });
  stand.deleted.forEach(function (id) { delListe.appendChild(karteEl(id, true)); });
  korbAnzeigen(); zaehle();
  [].forEach.call(document.querySelectorAll("textarea"), wachse);
  melde();
}
function korbAnzeigen() { document.getElementById("papierkorb").classList.toggle("hat", delListe.children.length > 0); }
function zaehle() {
  var sichtbar = liste.querySelectorAll(".card:not(.versteckt)").length;
  var extra = delListe.children.length;
  document.getElementById("zaehler").textContent = sichtbar + " " + T("karten") + (extra ? " · " + extra + " " + T("imKorb") : "");
}
function melde() {}

/* Ziehen */
var zieh = null;
liste.addEventListener("pointerdown", function (e) {
  var card = e.target.closest(".card");
  if (!card || document.body.classList.contains("gefiltert")) return;
  if (e.target.closest("textarea, input, button, .aktionen")) return;
  zieh = { card: card, x: e.clientX, y: e.clientY, aktiv: false, ph: null };
  try { card.setPointerCapture(e.pointerId); } catch (err) {}
});
liste.addEventListener("pointermove", function (e) {
  if (!zieh) return;
  var dy = e.clientY - zieh.y, dx = e.clientX - zieh.x;
  if (!zieh.aktiv) {
    if (Math.abs(dy) < 7 && Math.abs(dx) < 7) return;
    zieh.aktiv = true;
    var r = zieh.card.getBoundingClientRect();
    zieh.war_offen = zieh.card.classList.contains("offen");
    zieh.card.classList.remove("offen");
    zieh.ph = document.createElement("li"); zieh.ph.className = "platzhalter"; zieh.ph.style.height = "40px";
    zieh.card.parentNode.insertBefore(zieh.ph, zieh.card.nextSibling);
    zieh.card.classList.add("dragging");
    zieh.card.style.position = "fixed"; zieh.card.style.width = r.width + "px"; zieh.card.style.left = r.left + "px";
    zieh.offset = Math.min(e.clientY - r.top, 20);
  }
  zieh.card.style.top = (e.clientY - zieh.offset) + "px";
  if (e.clientY < 90) window.scrollBy(0, -14); else if (e.clientY > window.innerHeight - 90) window.scrollBy(0, 14);
  var ziel = document.elementFromPoint(e.clientX, e.clientY);
  ziel = ziel && ziel.closest ? ziel.closest("#liste .card") : null;
  if (ziel && ziel !== zieh.card) {
    var r2 = ziel.getBoundingClientRect();
    if (e.clientY < r2.top + r2.height / 2) liste.insertBefore(zieh.ph, ziel); else liste.insertBefore(zieh.ph, ziel.nextSibling);
  }
});
function ziehEnde(e) {
  if (!zieh) return;
  var card = zieh.card;
  if (zieh.aktiv) {
    card.classList.remove("dragging"); if (zieh.war_offen) card.classList.add("offen");
    card.style.position = ""; card.style.width = ""; card.style.left = ""; card.style.top = "";
    liste.insertBefore(card, zieh.ph); zieh.ph.remove(); speichere();
  } else if (!e.target.closest("textarea, input, button, .aktionen")) { card.classList.toggle("offen"); melde(); }
  zieh = null;
}
liste.addEventListener("pointerup", ziehEnde);
liste.addEventListener("pointercancel", ziehEnde);

/* Filter */
function filter(art, knopf) {
  ["btnAlle", "btnG", "btnF"].forEach(function (b) { document.getElementById(b).classList.remove("aktiv"); });
  knopf.classList.add("aktiv");
  document.body.classList.toggle("gefiltert", art !== null);
  [].forEach.call(liste.children, function (li) { li.classList.toggle("versteckt", art !== null && !li.classList.contains(art)); });
  zaehle(); melde();
}
document.getElementById("btnAlle").onclick = function () { filter(null, this); };
document.getElementById("btnG").onclick = function () { filter("g", this); };
document.getElementById("btnF").onclick = function () { filter("f", this); };

/* Neue Szene */
document.getElementById("btnNeu").onclick = function () {
  var n = 1;
  Object.keys(stand.custom).forEach(function (id) { var m = id.match(/^N(\d+)$/); if (m) n = Math.max(n, parseInt(m[1], 10) + 1); });
  var id = "N" + n;
  stand.custom[id] = { titel: T("neuTitel"), text: "" };
  var li = karteEl(id, false);
  liste.insertBefore(li, liste.firstChild);
  speichere(); zaehle(); melde();
  li.querySelector(".titelfeld").focus();
};

/* Vorlagen */
function vorlage(basis, name, delBasis) {
  var frage = delBasis ? T("autorFrage") : T("vorlageFrage")(name);
  if (!confirm(frage)) return;
  if (delBasis) {
    delBasis.forEach(function (id) { if (stand.deleted.indexOf(id) === -1) stand.deleted.push(id); });
  }
  var custom = Object.keys(stand.custom).filter(function (id) { return stand.deleted.indexOf(id) === -1; });
  stand.order = basis.filter(function (id) { return stand.deleted.indexOf(id) === -1; }).concat(custom);
  speichereOhneDom(); baue(); filter(null, document.getElementById("btnAlle"));
}
document.getElementById("btnAusgang").onclick = function () { vorlage(AUSGANG, T("bAusgang")); };
document.getElementById("btnChrono").onclick = function () { vorlage(CHRONO, T("bChrono")); };
document.getElementById("btnVorschlag").onclick = function () { vorlage(VORSCHLAG, T("bVorschlag")); };
document.getElementById("btnAutor").onclick = function () { vorlage(AUTOR.order, T("bAutor"), AUTOR.deleted); };

/* Auf-/Zuklappen */
document.getElementById("btnKlapp").onclick = function () {
  var offen = liste.querySelector(".card.offen");
  [].forEach.call(liste.children, function (li) { li.classList.toggle("offen", !offen); });
  this.textContent = offen ? T("bKlappAuf") : T("bKlappZu");
  melde();
};

/* Export */
function exportZeile(id) {
  var k = info(id);
  var z = id + " · " + seqVon(k) + " · " + (k.strang === "N" ? ((stand.custom[id] || {}).titel || T("neuTitel")) : titelVon(k));
  var extra = [];
  if (k.strang === "N" && (stand.custom[id] || {}).text) extra.push(T("expText") + stand.custom[id].text.split("\n").join("\n         "));
  if (stand.notes[id]) extra.push(T("expNotiz") + stand.notes[id].split("\n").join("\n             "));
  return [z].concat(extra).join("\n");
}
document.getElementById("btnExport").onclick = function () {
  speichere();
  var teile = [T("expKopf")(new Date().toLocaleString(lang === "en" ? "en-GB" : "de-DE")), T("expLegende"), ""];
  stand.order.forEach(function (id) { teile.push(exportZeile(id)); });
  if (stand.deleted.length) { teile.push(""); teile.push(T("expDel")); stand.deleted.forEach(function (id) { teile.push(exportZeile(id)); }); }
  document.getElementById("export").value = teile.join("\n");
  document.getElementById("overlay").classList.add("offen");
};
document.getElementById("btnKopieren").onclick = function () {
  var t = document.getElementById("export"); t.select(); document.execCommand("copy");
  this.textContent = T("kopiert"); var self = this; setTimeout(function () { self.textContent = T("bKopieren"); }, 1500);
};
document.getElementById("btnZu").onclick = function () { document.getElementById("overlay").classList.remove("offen"); };

/* Sprache anwenden */
function sprache(neu) {
  if (neu !== "de" && neu !== "en") return;
  lang = neu;
  document.documentElement.lang = lang;
  [].forEach.call(document.querySelectorAll("[data-l]"), function (el) {
    var k = el.getAttribute("data-l");
    if (k === "bKlapp") { el.textContent = liste.querySelector(".card.offen") ? T("bKlappZu") : T("bKlappAuf"); return; }
    var v = T(k); if (typeof v === "string") el.textContent = v;
  });
  baue();
  document.getElementById("btnKlapp").textContent = liste.querySelector(".card.offen") ? T("bKlappZu") : T("bKlappAuf");
}
window.addEventListener("message", function (e) {
  if (e.data && e.data.type === "verwebung-lang") sprache(e.data.lang);
  if (e.data && e.data.type === "verwebung-blau") document.body.classList.toggle("blau", !!e.data.blau);
});
sprache(lang);
</script>
</body>
</html>
